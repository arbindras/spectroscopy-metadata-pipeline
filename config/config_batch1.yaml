# ============================================================
# SPECTROSCOPY METADATA PIPELINE - BATCH 1
# ============================================================
#
#   python pipeline.py --config config/config_batch1.yaml --all
#   python build_curated_parquet.py --batch batch1 --output-dir D:/output
#
# Batch1 layout differs from Batch0: most datasets are a single
# "<record_id>_<title>.zip" file directly under the root (often with
# nested zips/tgz/rar inside), and every record has a paper
# papers/<record_id>.pdf.
# ============================================================

paths:

  dataset_roots:
    - "D:/Batch1_datasets"

  # Full Zenodo metadata; pipeline.only_mapped_records restricts --all to
  # the records that actually exist under dataset_roots.
  metadata_file: "D:/zenodo_metadata.csv"

  # Papers named <record_id>.pdf; regex candidates are written as
  # source_type='pdf' evidence.
  papers_directory: "C:/Users/Admin/RAG/2/papers"

  # Kept separate from Batch0's automated outputs in D:/output.
  output_directory: "D:/output/batch1"


mapping:

  # No explicit mapping needed: root entries named "<record_id>_..."
  # (folders or archive files) are matched by record id.
  mapping_file: null
  allow_record_id_prefix_match: true
  search_depth: 1
  allow_exact_doi_directory_match: false
  allow_exact_title_directory_match: false


scanner:

  inspect_archives: true
  max_archive_members: 20000
  # zip-in-zip / tgz-in-zip / rar-in-zip
  max_archive_depth: 3
  # Nested archives larger than this are listed but not opened.
  nested_archive_max_mb: 4096
  # __MACOSX/, ._*, .DS_Store, Thumbs.db
  skip_junk_members: true


readers:

  csv_delimiter_by_ext:
    .csv: ","
    .tsv: "\t"

  numeric_header_min_count: 5

  # MAT/HDF5 files above this size: structure only (6616006 has 14-16 GB .mat).
  large_file_skip_mb: 1024

  text_max_mb: 500
  text_min_points: 10
  # Accept bare number columns (monotonic first column) at confidence 0.5;
  # the unit is then taken from the dataset README when it states one.
  text_accept_unlabelled_axis: true
  fits_max_mb: 512


pipeline:

  extract_archive_members: true
  archive_member_max_mb: 2048
  write_empty_spectral_row: true
  only_mapped_records: true
  paper_evidence_max: 500


logging:

  level: "INFO"
